<!DOCTYPE html>
<html lang="en">

<head>
    <title>Employee Leave Request Form</title>
</head>

<body>
    <h1>Employee Leave Request Form</h1>
    <br><br>
    <label for="employee_name">Employee Name:</label>
    <input type="text" id="employee_name" name="employee_name" placeholder="Enter your full name" required>
    <br><br>
    <label for="employee_id">Employee ID:</label>
    <input type="text" id="employee_id" name="employee_id" placeholder="Enter your employee ID" required>
    <br><br>
    <label for="Email">Enter Mail:</label>
    <input type="email" id="Email" name="Email" placeholder="Enter your email address" required>
    <br><br>
    <h3>Department DropDown</h3>
    <label for="Department">Department:</label>
    <select id="Department" name="Department" required>
        <option value="">-- Select Department --</option>
        <option value="HR">Human Resources</option>
        <option value="IT">Information Technology</option>
        <option value="Finance">Finance</option>
        <option value="Marketing">Marketing</option>
    </select>
    <br><br>
    <label for="leave_type">Leave Type:</label>
    <select id="leave_type" name="leave_type" required>
        <option value="">-- Select Leave Type --</option>
        <option value="sick_leave">Sick Leave</option>
        <option value="casual_leave">Casual Leave</option>
        <option value="earned_leave">Earned Leave</option>
        <option value="Work From Home">Work From Home</option>
        <option value="Others">Others</option>
    </select>
    <br><br>
    <label for="Start Date">Start Date:</label>
    <input type="date" id="Start Date" name="Start Date" required>
    <br><br>
    <label for="End Date">End Date</label>
    <input type="date" id="End Date" name="End Date" required>
    <br><br>
    <label for="Number Field">Number Field:</label>
    <input type="number" id="Number Field" name="Number Field" placeholder="Enter Number Field" min="1" max="100000"
        step="1" required>
    <br><br>
    <label for="The Employee Is Reachable During Leave">The Employee Is Reachable During Leave:</label>
    <input type="radio" id="Yes" name="The Employee Is Reachable During Leave" value="Yes" required>
    <label for="Yes">Yes</label>
    <input type="radio" id="No" name="The Employee Is Reachable During Leave" value="No" required>
    <label for="No">No</label>
    <br><br>

    <label for="Leave Reason">Why do you leave this Organisation?</label>
    <br>

    <textarea id="Leave Reason" name="Leave Reason" rows="6" cols="45" placeholder="Why do you want to leave..."
        minlength="10" maxlength="300" required></textarea>

    <input type="submit" value="Submit Leave Request">
    <input type="reset" value="Reset Request Form">

</body>
