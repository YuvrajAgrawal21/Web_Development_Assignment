
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 3 - Responsive Two Boxes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        nav {
            background: yellow;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 70%;
            margin: 35px auto;
            display: flex;
            gap: 35px;
        }

        .box {
            flex: 1;
            height: 193px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
        }

        .left {
            background: red;
        }

        .right {
            background: green;
        }

        @media (max-width: 600px) {
            nav {
                font-size: 28px;
                padding: 24px;
            }

            .container {
                width: 85%;
                flex-direction: column;
                gap: 20px;
                margin: 25px auto;
            }

            .box {
                flex: none;
                width: 100%;
                height: 163px;
            }
        }
    </style>
</head>

<body>
    <nav>Navigation</nav>

    <main class="container">
        <div class="box left">LEFT BOX</div>
        <div class="box right">RIGHT BOX</div>
    </main>
</body>
</html>
