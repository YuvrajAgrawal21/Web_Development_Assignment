
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IW Assignment 1 - Responsive Boxes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        nav {
            background-color: yellow;
            padding: 22px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 25px;
        }

        .box {
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
        }

        .box1 {
            background-color: red;
        }

        .box2 {
            background-color: green;
        }

        .box3 {
            background-color: blue;
        }

        .box4 {
            background-color: gray;
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }

            .box1 {
                grid-column: 1;
                grid-row: 1;
            }

            .box3 {
                grid-column: 2;
                grid-row: 1;
            }

            .box2 {
                grid-column: 1;
                grid-row: 2;
            }

            .box4 {
                grid-column: 2;
                grid-row: 2;
            }
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }

            .box1 {
                order: 1;
            }

            .box4 {
                order: 2;
            }

            .box2 {
                order: 3;
            }

            .box3 {
                order: 4;
            }
        }
    </style>
</head>

<body>
    <nav>Navigation</nav>

    <main class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
    </main>
</body>
</html>
