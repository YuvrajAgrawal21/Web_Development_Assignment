
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 5 - Investors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        header p {
            color: #666;
            line-height: 1.6;
        }

        .investors {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto 45px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }

        .investor-card {
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 3px 12px #0000000d;
            text-align: center;
        }

        .investor-card h2 {
            margin: 0;
            font-size: 21px;
            color: #333;
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .investors {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 28px;
            }

            .investors {
                grid-template-columns: 1fr;
                width: 88%;
                gap: 16px;
            }

            .investor-card {
                min-height: 110px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Our Investors</h1>
        <p>We are grateful to the investors who support our growth and vision.</p>
    </header>

    <main class="investors">
        <section class="investor-card">
            <h2>Investor 1</h2>
        </section>

        <section class="investor-card">
            <h2>Investor 2</h2>
        </section>

        <section class="investor-card">
            <h2>Investor 3</h2>
        </section>

        <section class="investor-card">
            <h2>Investor 4</h2>
        </section>

        <section class="investor-card">
            <h2>Investor 5</h2>
        </section>

        <section class="investor-card">
            <h2>Investor 6</h2>
        </section>
    </main>
</body>
</html>
