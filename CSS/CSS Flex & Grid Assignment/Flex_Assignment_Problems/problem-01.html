<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .header {
            height: 55px;
            background-color: #172b4d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .nav {
            display: flex;
            gap: 30px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: 11px;
        }

        .gallery-section {
            width: 800px;
            margin: 30px auto;
            text-align: center;
        }

        .gallery-section h1 {
            color: #273b5c;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .line {
            width: 45px;
            height: 3px;
            background-color: #e3a31b;
            margin: auto;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .gallery img {
            width: 220px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">GLA<br>UNIVERSITY</div>

        <nav class="nav">
            <a href="#">HOME</a>
            <a href="#">GALLERY</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <section class="gallery-section">

        <h1>PHOTO GALLERY</h1>
        <div class="line"></div>

        <div class="gallery">

            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d"
                 alt="Photo 1">

            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475"
                 alt="Photo 2">

            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32"
                 alt="Photo 3">

            <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32"
                 alt="Photo 4">

            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475"
                 alt="Photo 5">

            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d"
                 alt="Photo 6">

        </div>

    </section>

</body>
</html>
