<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 330px;
            margin: 70px auto;
            padding: 25px;
            box-shadow: 0 2px 10px #ccc;
        }

        .display {
            height: 70px;
            border-radius: 8px;
            box-shadow: inset 0 1px 5px #ddd;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 2px 6px #ddd;
            font-size: 16px;
            font-weight: bold;
        }

        .operator {
            background-color: black;
            color: white;
        }

        .clear {
            background-color: red;
            color: white;
        }

    </style>
</head>

<body>

    <div class="calculator">

        <div class="display"></div>

        <div class="buttons">

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">x</button>

            <button class="clear">C</button>
            <button>0</button>
            <button class="operator">=</button>
            <button class="operator">/</button>

        </div>

    </div>

</body>
</html>
