<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .container {
            width: 700px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 100px 100px 100px;
            gap: 10px;
            grid-template-areas:
                "a b"
                "c d"
                "e e";
        }

        .box {
            background-color: #444;
            color: white;
            padding: 20px;
            font-size: 25px;
            border-radius: 5px;
        }

        .a {
            grid-area: a;
        }

        .b {
            grid-area: b;
        }

        .c {
            grid-area: c;
        }

        .d {
            grid-area: d;
        }

        .e {
            grid-area: e;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box a">A</div>
        <div class="box b">B</div>
        <div class="box c">C</div>
        <div class="box d">D</div>
        <div class="box e">E</div>

    </div>

</body>
</html>
