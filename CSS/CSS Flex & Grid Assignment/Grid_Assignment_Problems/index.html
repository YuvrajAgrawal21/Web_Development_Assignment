<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid problem 5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #container {
            width: 599px;
            height: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 100px);
            gap: 15px;
            grid-template-areas:
                "a b b c"
                "d d e f"
                "g h i i";
        }
        #container div {
            text-align: center;
            background-color: #5d78f0;
            border-radius: 5px;
        }
        #container .item:nth-child(1) {
            grid-area: a;
        }
        #container .item:nth-child(2) {
            grid-area: b;
        }
        #container .item:nth-child(3) {
            grid-area: c;
        }
        #container .item:nth-child(4) {
            grid-area: d;
        }
        #container .item:nth-child(5) {
            grid-area: e;
        }
        #container .item:nth-child(6) {
            grid-area: f;
        }
        #container .item:nth-child(7) {
            grid-area: g;
        }
        #container .item:nth-child(8) {
            grid-area: h;
        }
        #container .item:nth-child(9) {
            grid-area: i;
        }
        
    </style>
</head>
<body>
    <div id="container">
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
        <div class="item" ></div>
    </div>
</body>
</html>
